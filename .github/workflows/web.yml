# Reusable: tests and builds web/ with pnpm, and publishes it to GitHub Pages from main. A repository with a library
# in packages/ and no web/ uses it only to test and pack the library, with pages: false.
name: Web

on:
  workflow_call:
    inputs:
      apk-artifact:
        description: Artifact holding an APK the site serves, from android.yml. Empty for none.
        type: string
        default: ''
      apk-path:
        description: Where the site's build looks for that APK
        type: string
        default: android/app/build/outputs/apk/release/app-release.apk
      verify:
        description: A command run in web/ after the build, such as one that checks committed output is current
        type: string
        default: ''
      pages:
        description: Publish web/dist to GitHub Pages on pushes to main
        type: boolean
        default: true
      library:
        description: A TypeScript library in packages/ to test and pack, uploaded as <library>-library for releases. Empty for none.
        type: string
        default: ''
      release-files:
        description: Files the build leaves in web/dist that a release carries, such as a signed web bundle (a glob). Empty for none.
        type: string
        default: ''
    secrets:
      WEB_BUNDLE_KEY:
        description: The key that signs an Isolated Web App's web bundle, given to the build as WEB_BUNDLE_KEY
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: inputs.apk-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.apk-artifact }}
          path: ${{ runner.temp }}/apk
      - name: Put the APK where the site expects it
        if: inputs.apk-artifact != ''
        env:
          APK_PATH: ${{ inputs.apk-path }}
        run: |
          mkdir -p "$(dirname "$APK_PATH")"
          mv "$RUNNER_TEMP"/apk/*.apk "$APK_PATH"
      - name: Test the library
        if: inputs.library != ''
        env:
          LIBRARY: ${{ inputs.library }}
        run: pnpm --dir "packages/$LIBRARY" test
      - name: Test
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: pnpm test
      - name: Build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        env:
          WEB_BUNDLE_KEY: ${{ secrets.WEB_BUNDLE_KEY }}
        run: pnpm run build
      - name: Verify
        if: inputs.verify != '' && hashFiles('web/package.json') != ''
        working-directory: web
        env:
          VERIFY: ${{ inputs.verify }}
        run: bash -c "$VERIFY"
      # Packing builds the library, and copies in the APK that's already at apk-path for it to carry.
      - name: Pack the library
        if: inputs.library != ''
        env:
          LIBRARY: ${{ inputs.library }}
        run: pnpm --dir "packages/$LIBRARY" pack --pack-destination "$RUNNER_TEMP/library"
      - if: inputs.library != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.library }}-library
          path: ${{ runner.temp }}/library/*.tgz
          if-no-files-found: error
      - if: inputs.release-files != ''
        uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: web/dist/${{ inputs.release-files }}
          if-no-files-found: error
      - if: inputs.pages && hashFiles('web/package.json') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  # The repository's Pages source has to be GitHub Actions.
  deploy:
    name: Publish to GitHub Pages
    if: inputs.pages && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
