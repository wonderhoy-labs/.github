# Reusable: formatting, Biome and the Wonderhoy Labs guideline, for every repository.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Biome and the guideline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm lint
      - name: Types in tools
        run: pnpm typecheck
      # Fails on anything the guideline requires, and warns where shared files differ from the template.
      - name: Guideline
        run: pnpm unify --remote
